# Categories for GitHub's auto-generated release notes, keyed off PR labels.
# CHANGELOG.md is still the curated source the release workflow publishes; this
# governs the "Generate release notes" button and anything not written up by hand.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: 🚨 Breaking Changes
      labels: ["changelog:breaking"]
    - title: 🔒 Security
      labels: ["changelog:security"]
    - title: 🚀 Features
      labels: ["changelog:feature"]
    - title: 🌟 Enhancements
      labels: ["changelog:enhancement"]
    - title: 🐛 Bug Fixes
      labels: ["changelog:bugfix"]
    - title: 📚 Documentation
      labels: ["changelog:documentation"]
    - title: 📦 Dependencies
      labels: ["changelog:dependencies", "dependencies"]
    - title: Other Changes
      labels: ["*"]
